plugins { id 'com.android.application' }

android {
    namespace 'my.cigunofal.kuasaimatematik'
    compileSdk 35

    defaultConfig {
        applicationId 'my.cigunofal.kuasaimatematik'
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


tasks.register('decodeAppIcon') {
    doLast {
        def sourceFile = file('src/main/icon/app_icon_art.b64')
        def outputFile = file('src/main/res/drawable/app_icon_art.webp')
        outputFile.parentFile.mkdirs()
        outputFile.bytes = sourceFile.text.trim().decodeBase64()
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('decodeAppIcon') }
